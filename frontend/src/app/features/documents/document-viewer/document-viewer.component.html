<div class="viewer-layout">
  
  <!-- HEADER -->
  <header class="viewer-header">
    <div class="header-info">
      <h1>Document Viewer</h1>
      <div class="meta-badges">
        <span class="badge" *ngIf="documentId">ID: {{ documentId }}</span>
        <span class="badge page-badge" *ngIf="page">Page {{ page }}</span>
      </div>
    </div>
  </header>

  <!-- LOADING STATE -->
  <div *ngIf="loading" class="viewer-loading">
    <div class="spinner"></div>
    <p>Učitavanje dokumenta...</p>
  </div>

  <!-- ERROR STATE -->
  <div *ngIf="errorMessage" class="error-message">
    <span class="error-icon">⚠️</span>
    <p>{{ errorMessage }}</p>
  </div>

  <!-- PDF VIEWER CONTAINER -->
  <main class="viewer-container" *ngIf="!loading && pdfUrl && !errorMessage">
    <iframe
      [src]="pdfUrl"
      class="pdf-iframe"
      frameborder="0"
    ></iframe>
  </main>

</div>
