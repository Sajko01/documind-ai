<div class="offers-page">

  <div class="page-header">

    <div>
      <h1>Offers</h1>

      <p>
        Manage customer offers
      </p>
    </div>

    <button
      mat-raised-button
      color="primary"
    >
      + New Offer
    </button>

  </div>


  <div
    *ngIf="loading"
    class="loading"
  >
    Loading offers...
  </div>


  <table
    *ngIf="!loading"
    mat-table
    [dataSource]="offers"
    class="offers-table"
  >

    <ng-container
      matColumnDef="offerNumber"
    >

      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Offer
      </th>

      <td
        mat-cell
        *matCellDef="let offer"
      >
        {{ offer.offerNumber }}
      </td>

    </ng-container>


    <ng-container
      matColumnDef="customerName"
    >

      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Customer
      </th>

      <td
        mat-cell
        *matCellDef="let offer"
      >
        {{ offer.customerName }}
      </td>

    </ng-container>


    <ng-container
      matColumnDef="total"
    >

      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Total
      </th>

      <td
        mat-cell
        *matCellDef="let offer"
      >
        {{ offer.total }}
        {{ offer.currency }}
      </td>

    </ng-container>


    <ng-container
      matColumnDef="status"
    >

      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Status
      </th>

      <td
        mat-cell
        *matCellDef="let offer"
      >
        {{ offer.status }}
      </td>

    </ng-container>


    <ng-container
      matColumnDef="createdAt"
    >

      <th
        mat-header-cell
        *matHeaderCellDef
      >
        Created
      </th>

      <td
        mat-cell
        *matCellDef="let offer"
      >
        {{ offer.createdAt | date }}
      </td>

    </ng-container>


    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns"
    ></tr>

    <tr
      mat-row
      *matRowDef="
        let row;
        columns: displayedColumns;
      "
    ></tr>

  </table>

</div>
