<mat-card>

  <mat-card-header>

    <mat-card-title>
      Questions AI couldn't answer
    </mat-card-title>

    <mat-card-subtitle>
      Questions with insufficient
      retrieval confidence
    </mat-card-subtitle>

  </mat-card-header>


  <mat-card-content>

    <table
      mat-table
      [dataSource]="questions"
      class="questions-table"
    >

      <ng-container
        matColumnDef="question"
      >

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Question
        </th>

        <td
          mat-cell
          *matCellDef="let item"
        >
          {{ item.question }}
        </td>

      </ng-container>


      <ng-container
        matColumnDef="confidence"
      >

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Confidence
        </th>

        <td
          mat-cell
          *matCellDef="let item"
        >

          {{
            item.confidence !== null
              ? (item.confidence * 100 | number:'1.0-1')
              : 0
          }}%

        </td>

      </ng-container>


      <ng-container
        matColumnDef="status"
      >

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Status
        </th>

        <td
          mat-cell
          *matCellDef="let item"
        >
          {{ item.status }}
        </td>

      </ng-container>


      <ng-container
        matColumnDef="createdAt"
      >

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Date
        </th>

        <td
          mat-cell
          *matCellDef="let item"
        >

          {{
            item.createdAt
              | date:'dd.MM.yyyy HH:mm'
          }}

        </td>

      </ng-container>


      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>


      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        "
      ></tr>

    </table>


    <div
      *ngIf="!loading && questions.length === 0"
    >

      No unanswered questions.

    </div>

  </mat-card-content>

</mat-card>
