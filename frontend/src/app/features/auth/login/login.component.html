<div class="auth-page">

  <div class="auth-card">

    <h1>DocuMind AI</h1>

    <p class="subtitle">
      Sign in to your account
    </p>

    <form>

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          placeholder="you@company.com"
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          placeholder="••••••••"
        />
      </div>

      <button type="submit">
        Login
      </button>

    </form>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">
        Create account
      </a>
    </p>

  </div>

</div>
