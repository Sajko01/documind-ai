<div class="auth-page">

  <div class="auth-card">

    <h1>Create your account</h1>

    <p class="subtitle">
      Start using DocuMind AI
    </p>

    <form>

      <div class="form-group">
        <label>Organization</label>

        <input
          type="text"
          placeholder="Company name"
        />
      </div>

      <div class="form-group">
        <label>Name</label>

        <input
          type="text"
          placeholder="Your full name"
        />
      </div>

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          placeholder="you@company.com"
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          placeholder="••••••••"
        />
      </div>

      <button type="submit">
        Create account
      </button>

    </form>

    <p class="register-link">
      Already have an account?
      <a routerLink="/login">
        Login
      </a>
    </p>

  </div>

</div>
